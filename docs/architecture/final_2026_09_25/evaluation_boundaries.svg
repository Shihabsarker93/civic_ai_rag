<text x="55" y="177.8" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#203448">A  MATCHED ANSWER-PIPELINE COMPARISON: EXISTING 30 QUESTIONS / THREE DOMAINS</text>
