<text x="55" y="707.8" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#203448">B  RETRIEVAL-ONLY ABLATION: NO ANSWER GENERATION, RERANKING OR EVIDENCE SELECTION</text>
