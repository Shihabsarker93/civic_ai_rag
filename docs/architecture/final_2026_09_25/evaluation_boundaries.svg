<polyline points="1165,860 1235,860" fill="none" stroke="#526578" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="260" width="270" height="165" rx="12" fill="#e6f5f1" stroke="#238578" stroke-width="1.8"/>
<text x="200.0" y="294.884" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15.1" font-weight="600" fill="#203448">Shared experimental inputs</text>
<text x="200.0" y="315.98400000000004" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15.1" font-weight="400" fill="#203448">Same 30 Bangla questions</text>
<text x="200.0" y="337.084" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15.1" font-weight="400" fill="#203448">Same domain-scoped corpus</text>
<text x="200.0" y="358.184" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15.1" font-weight="400" fill="#203448">Same BGE-M3 embeddings</text>
<text x="200.0" y="379.284" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15.1" font-weight="400" fill="#203448">Same Qwen3:8b generator</text>
<text x="200.0" y="400.384" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15.1" font-weight="400" fill="#203448">Same selected-evidence prompt</text>
<rect x="400" y="225" width="355" height="120" rx="12" fill="#eaf1fb" stroke="#5276a6" stroke-width="1.8"/>
<text x="577.5" y="255.12" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#203448">Matched Simple RAG</text>
<text x="577.5" y="279.12" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">Dense top 6</text>
<text x="577.5" y="303.12" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">Whole-chunk context budget</text>
<text x="577.5" y="327.12" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">No RRF / reranker / selector</text>
<rect x="400" y="410" width="355" height="140" rx="12" fill="#e6f5f1" stroke="#238578" stroke-width="1.8"/>
<text x="577.5" y="442.76800000000003" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15.2" font-weight="600" fill="#203448">CivicRAG</text>
<text x="577.5" y="463.968" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15.2" font-weight="400" fill="#203448">Dense + BM25 -&gt; RRF -&gt; reranking</text>
<text x="577.5" y="485.168" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15.2" font-weight="400" fill="#203448">Domain-specific processing if triggered</text>
<text x="577.5" y="506.36800000000005" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15.2" font-weight="400" fill="#203448">Automatic evidence selection</text>
<text x="577.5" y="527.568" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15.2" font-weight="400" fill="#203448">and compatible-section expansion</text>
<rect x="840" y="285" width="300" height="185" rx="12" fill="#eaf1fb" stroke="#5276a6" stroke-width="1.8"/>
<text x="990.0" y="331.18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#203448">Matched generation settings</text>
<text x="990.0" y="351.68" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#203448">Qwen3:8b through Ollama</text>
<text x="990.0" y="372.18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#203448">Up to 6 passages / 14,000 chars</text>
<text x="990.0" y="392.68" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#203448">Same prompt and output checks</text>
<text x="990.0" y="413.18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#203448">Saved answers + actual contexts</text>
<text x="990.0" y="433.68" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#203448">No regenerated answers for scoring</text>
<rect x="1230" y="225" width="470" height="145" rx="12" fill="#fff4dd" stroke="#b88426" stroke-width="1.8"/>
<text x="1465.0" y="269.592" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16.3" font-weight="600" fill="#203448">Automatic answer/context evaluation</text>
<text x="1465.0" y="291.892" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16.3" font-weight="400" fill="#203448">RAGAS faithfulness + answer relevancy</text>
<text x="1465.0" y="314.192" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16.3" font-weight="400" fill="#203448">Custom binary context relevance (separate metric)</text>
<text x="1465.0" y="336.49199999999996" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16.3" font-weight="400" fill="#203448">Qwen3 self-judge: exploratory, not gold accuracy</text>
<rect x="1230" y="435" width="470" height="100" rx="12" fill="#f0f3f6" stroke="#7b8b9b" stroke-width="1.8"/>
<text x="1465.0" y="467.582" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17.3" font-weight="600" fill="#203448">Descriptive reporting</text>
<text x="1465.0" y="490.882" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17.3" font-weight="400" fill="#203448">Saved latency, context size, language fraction</text>
<text x="1465.0" y="514.182" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17.3" font-weight="400" fill="#203448">Not proof of factual correctness</text>
<rect x="65" y="805" width="250" height="110" rx="12" fill="#e6f5f1" stroke="#238578" stroke-width="1.8"/>
<text x="190.0" y="842.12" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#203448">Current 30 questions</text>
<text x="190.0" y="866.12" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">10 per domain</text>
<text x="190.0" y="890.12" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">Domain-scoped indices</text>
<rect x="385" y="780" width="350" height="165" rx="12" fill="#eaf1fb" stroke="#5276a6" stroke-width="1.8"/>
<text x="560.0" y="820.62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#203448">Three retrieval variants</text>
<text x="560.0" y="844.62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">BM25-only</text>
<text x="560.0" y="868.62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">BGE-M3 dense-only</text>
<text x="560.0" y="892.62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">Weighted Hybrid RRF</text>
<text x="560.0" y="916.62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">Top 20 -&gt; evaluate top 5</text>
<rect x="805" y="780" width="360" height="165" rx="12" fill="#fff4dd" stroke="#b88426" stroke-width="1.8"/>
<text x="985.0" y="821.284" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17.6" font-weight="600" fill="#203448">Pooled relevance labels</text>
<text x="985.0" y="844.884" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17.6" font-weight="400" fill="#203448">Union of each variant&#x27;s top 5</text>
<text x="985.0" y="868.484" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17.6" font-weight="400" fill="#203448">Assistant-reviewed, not human gold</text>
<text x="985.0" y="892.0840000000001" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17.6" font-weight="400" fill="#203448">Uncertain questions excluded</text>
<text x="985.0" y="915.684" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17.6" font-weight="400" fill="#203448">26/30 provisionally scorable</text>
<rect x="1235" y="780" width="470" height="165" rx="12" fill="#e6f5f1" stroke="#238578" stroke-width="1.8"/>
<text x="1470.0" y="820.62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#203448">Per-domain and overall retrieval metrics</text>
<text x="1470.0" y="844.62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">Hit@1 / Hit@5 / Precision@5 / MRR@5</text>
<text x="1470.0" y="868.62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">Pooled Recall@5 / pooled nDCG@5</text>
<text x="1470.0" y="892.62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">Recall/nDCG: 25 nonempty eligible pools</text>
<text x="1470.0" y="916.62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">Not end-to-end chatbot correctness</text>
<text x="65" y="595.78" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#203448">This baseline is scripts/run_simple_matched.py, not necessarily every legacy branch of the live Simple RAG option.</text>
<text x="65" y="1016.78" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#203448">Separate historical check: the current birth/death index was also tested on 58 existing P2-labelled questions (19 paraphrase groups).</text>
<text x="65" y="1039.78" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#203448">Do not merge those scores with the current 30-question results or interpret pooled recall as exhaustive corpus recall.</text>
<text x="65" y="1145.28" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#203448">The overnight Qwen draft-labeling experiment is a separate exploratory artifact with unresolved judgments, not final ground truth.</text>
<text x="65" y="1168.28" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#203448">Evaluation is outside the online chatbot path. No RAGAS judge or relevance-review process runs when a citizen submits a normal query.</text>
<text x="65" y="1191.28" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#203448">These diagrams describe implemented paths, not a novel-model-training claim or proof that one method is universally superior.</text>
</svg>