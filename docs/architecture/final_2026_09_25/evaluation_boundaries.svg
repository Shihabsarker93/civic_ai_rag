<text x="45" y="104.12" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#203448">Keep answer-pipeline comparison separate from retrieval-only ablations and legacy P2 evaluation.</text>
